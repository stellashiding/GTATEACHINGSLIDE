<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Georgia Tech Lab 2 | Variables in p5.js</title>
<style>
:root{--pink:#ff3b82;--pale:#fff7fa;--ink:#171317;--muted:#70646a}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,Arial,sans-serif;background:#0b0b0b;color:var(--ink)}body{display:grid;grid-template-rows:1fr 64px;overflow:hidden}main{display:grid;min-height:0}.slide{width:100vw;height:calc(100vh - 64px);padding:42px 54px;background:var(--pale);overflow:auto;position:relative}.dark{background:#101010;color:#fff}.eyebrow{color:var(--pink);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.time{position:absolute;right:54px;top:38px;padding:7px 13px;border-radius:999px;background:#ffe0eb;color:#9d174d;font-weight:800}.dark .time{background:#341522;color:#ff9bc0}h1{font-size:58px;line-height:1.03;margin:28px 0 18px}h2{font-size:38px;line-height:1.1;margin:10px 0 20px}h3{font-size:20px;margin:0 0 8px}p,li{font-size:18px;line-height:1.45;color:var(--muted)}.dark p,.dark li{color:#d5cbd0}.lead{max-width:820px;font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:18px;border:1px solid #ead9e0;border-radius:12px;background:#fff}.dark .card{background:#25141c;border-color:#4a2936}.step{display:grid;grid-template-columns:38px 1fr;gap:12px;margin:10px 0}.num{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--pink);color:#fff;font-weight:800}.code{white-space:pre-wrap;font:16px/1.4 ui-monospace,monospace;background:#111;color:#fff;padding:17px;border-radius:10px}.prompt{padding:16px 18px;border-left:6px solid var(--pink);background:#fff;border-radius:8px;margin-top:15px}.dark .prompt{background:#25141c}.level{font-size:13px;font-weight:800;color:var(--pink);letter-spacing:1px;text-transform:uppercase}.nav{display:flex;align-items:center;justify-content:center;gap:10px;background:#111;border-top:1px solid #3b2830}.nav button,.nav a{padding:9px 15px;border:1px solid #603447;border-radius:999px;background:#1d1519;color:#fff;text-decoration:none;cursor:pointer}#count{min-width:78px;text-align:center;color:#e6ccd6}.page{position:absolute;right:24px;bottom:15px;color:#aa979f;font-size:12px}@media(max-width:800px){.slide{padding:28px 22px}.grid,.cards{grid-template-columns:1fr}h1{font-size:42px}h2{font-size:31px}.time{right:22px;top:22px}.nav a{display:none}}@media print{body{display:block}.nav{display:none}.slide{width:100%;height:auto;min-height:100vh}}html:fullscreen body{grid-template-rows:1fr}html:fullscreen .nav{display:none}html:fullscreen .slide{height:100vh}
</style></head><body><main id="deck"></main><nav class="nav"><a href="index.html">← Activities</a><button id="prev">← Previous</button><span id="count"></span><button id="next">Next →</button><button id="full">Full screen</button></nav>
<script>
const slides=[
{dark:1,eye:"Georgia Tech · Lab 2",time:"0–2 min",body:`<h1>Make One Number<br>Control a Whole Scene</h1><p class="lead">Variables and relationships in p5.js</p><div class="cards"><div class="card"><h3>Goal</h3><p>Build a house and car that stay together when values change.</p></div><div class="card"><h3>Work style</h3><p>Predict, code, test, and compare with a partner.</p></div><div class="card"><h3>Finish line</h3><p>A scene controlled by named variables.</p></div></div>`},
{eye:"Opening activity",time:"2–8 min",body:`<h2>Human p5.js</h2><p class="lead">Pair up. One person is the “computer.” The other gives one drawing command.</p><div class="grid"><div><div class="step"><span class="num">1</span><p>Choose <code>rect</code> or <code>ellipse</code>.</p></div><div class="step"><span class="num">2</span><p>Say every argument aloud, in order.</p></div><div class="step"><span class="num">3</span><p>Your partner points to where it would appear.</p></div><div class="step"><span class="num">4</span><p>Switch roles and make one argument intentionally strange.</p></div></div><pre class="code">rect(80, 160, 120, 90);\nellipse(280, 210, 70, 70);</pre></div><div class="prompt"><strong>Whole-class check:</strong> Which argument moved the shape? Which argument resized it?</div>`},
{eye:"Lesson map",time:"8–10 min",body:`<h2>Three levels of control</h2><div class="cards"><div class="card"><div class="level">Level 1</div><h3>Name one value</h3><p>Replace a repeated number with a variable.</p></div><div class="card"><div class="level">Level 2</div><h3>Move one object</h3><p>Use position variables in every part.</p></div><div class="card"><div class="level">Level 3</div><h3>Connect the parts</h3><p>Calculate positions and sizes from shared values.</p></div></div><div class="prompt"><strong>Rule for today:</strong> predict first, run second, explain what changed.</div>`},
{eye:"Level 1 · Instructor demo",time:"10–14 min",body:`<div class="grid"><div><h2>A variable gives a value a name</h2><p>Change <code>houseX</code> once. Every reference updates.</p><pre class="code">let houseX = 60;\nlet houseY = 220;\n\nrect(houseX, houseY, 140, 110);</pre></div><div><div class="prompt"><strong>Predict:</strong> If <code>houseX</code> becomes 160, what moves and what stays unchanged?</div><p>Ask for a show of hands before running the code.</p></div></div>`},
{eye:"Level 1 · Student practice",time:"14–19 min",body:`<h2>Practice 1: change one value</h2><div class="grid"><pre class="code">function setup() {\n  createCanvas(600, 400);\n}\n\nfunction draw() {\n  background(240);\n  let houseX = 60;\n  rect(houseX, 220, 140, 110);\n}</pre><div><div class="step"><span class="num">1</span><p>Run the starter code.</p></div><div class="step"><span class="num">2</span><p>Change <code>houseX</code> to 160.</p></div><div class="step"><span class="num">3</span><p>Add <code>houseY</code> and replace 220.</p></div><div class="step"><span class="num">4</span><p>Show your partner the two values that control position.</p></div></div></div>`},
{eye:"Level 2 · Guided build",time:"19–28 min",body:`<h2>Practice 2: attach the roof</h2><div class="grid"><pre class="code">let houseX = 60;\nlet houseY = 220;\nlet houseW = 140;\nlet houseH = 110;\n\nrect(houseX, houseY, houseW, houseH);\ntriangle(\n houseX, houseY,\n houseX + houseW / 2, houseY - 80,\n houseX + houseW, houseY\n);</pre><div><div class="step"><span class="num">1</span><p>Copy and run the code.</p></div><div class="step"><span class="num">2</span><p>Change <code>houseX</code> twice.</p></div><div class="step"><span class="num">3</span><p>Change <code>houseW</code>.</p></div><div class="step"><span class="num">4</span><p>Trace every place where the roof depends on the house.</p></div></div></div>`},
{eye:"Level 3 · Instructor demo",time:"28–33 min",body:`<h2>Relationships keep proportions</h2><div class="grid"><pre class="code">let doorW = houseW * 0.25;\nlet doorH = houseH * 0.55;\nlet doorX = houseX +\n  (houseW - doorW) / 2;\nlet doorY = houseY +\n  houseH - doorH;\n\nrect(doorX, doorY, doorW, doorH);</pre><div><h3>Read the code as sentences</h3><p>The door width is one quarter of the house width.</p><p>The door sits in the horizontal center.</p><p>The bottom of the door meets the bottom of the house.</p></div></div>`},
{eye:"Level 3 · Student practice",time:"33–39 min",body:`<h2>Practice 3: connect the door</h2><div class="grid"><div><div class="step"><span class="num">1</span><p>Add the four door variables.</p></div><div class="step"><span class="num">2</span><p>Change <code>houseW</code> from 140 to 220.</p></div><div class="step"><span class="num">3</span><p>Change <code>houseH</code> from 110 to 160.</p></div><div class="step"><span class="num">4</span><p>Explain why the door stays attached.</p></div></div><div class="prompt"><strong>Debug hint:</strong> If a part does not move or resize, look for a number that should depend on a variable.</div></div>`},
{dark:1,eye:"Challenge · Car",time:"39–49 min",body:`<h2>Build a car that moves as one object</h2><div class="grid"><pre class="code">let carX = 340;\nlet carY = 270;\nlet carW = 160;\nlet carH = 55;\nlet wheelD = carW * 0.20;\n\nrect(carX, carY, carW, carH);\nellipse(carX + carW * 0.25,\n carY + carH, wheelD, wheelD);\nellipse(carX + carW * 0.75,\n carY + carH, wheelD, wheelD);</pre><div><div class="step"><span class="num">1</span><p>Move the car with only <code>carX</code>.</p></div><div class="step"><span class="num">2</span><p>Resize it with only <code>carW</code>.</p></div><div class="step"><span class="num">3</span><p>Add one window that stays attached.</p></div></div></div>`},
{eye:"Choose your stretch",time:"49–53 min",body:`<h2>One challenge, your choice</h2><div class="cards"><div class="card"><div class="level">Accessible</div><h3>Color control</h3><p>Create <code>carColor</code> and use it in <code>fill()</code>.</p></div><div class="card"><div class="level">Intermediate</div><h3>Two houses</h3><p>Draw a second house by changing only position values.</p></div><div class="card"><div class="level">Advanced</div><h3>Responsive scene</h3><p>Use <code>width</code> or <code>height</code> so the layout responds to canvas size.</p></div></div><div class="prompt"><strong>Partner test:</strong> Ask your partner to change one variable. Your scene should remain recognizable.</div>`},
{eye:"Gallery check",time:"53–56 min",body:`<h2>Two-minute code gallery</h2><div class="grid"><div><div class="step"><span class="num">1</span><p>Leave your scene running.</p></div><div class="step"><span class="num">2</span><p>Visit a nearby screen.</p></div><div class="step"><span class="num">3</span><p>Find one useful variable relationship.</p></div></div><div class="card"><h3>Give one specific comment</h3><p>“When I changed ______, I noticed ______ stayed connected because ______.”</p></div></div>`},
{dark:1,eye:"Post activity",time:"56–59 min",body:`<h2>Predict, vote, explain</h2><p class="lead">A student changes <code>houseW</code> from 140 to 280. The door width is still written as <code>35</code>. What happens?</p><div class="cards"><div class="card"><h3>A</h3><p>The whole scene doubles perfectly.</p></div><div class="card"><h3>B</h3><p>The house grows, but the door looks too small.</p></div><div class="card"><h3>C</h3><p>The house moves right.</p></div></div><div class="prompt"><strong>Answer: B.</strong> Repair it with <code>let doorW = houseW * 0.25;</code></div>`},
{eye:"Exit ticket",time:"59–60 min",body:`<h2>Complete one sentence before you leave</h2><div class="cards"><div class="card"><h3>I understand</h3><p>A variable is useful because…</p></div><div class="card"><h3>I can debug</h3><p>When a shape separates, I will check…</p></div><div class="card"><h3>I want to try</h3><p>Next, I would make this scene…</p></div></div><p class="lead"><strong>Submit:</strong> p5.js link, screenshot, short description, and required recording.</p>`},
{dark:1,eye:"Instructor backup",time:"If time remains",body:`<h2>Fast extensions and recovery</h2><div class="grid"><div class="card"><h3>If students finish early</h3><p>Add keyboard movement, a sun positioned from canvas width, or a second proportional object.</p></div><div class="card"><h3>If students need more time</h3><p>Stop after the attached roof. Ask them to show that changing <code>houseX</code> moves both parts.</p></div></div><div class="prompt"><strong>Minimum learning evidence:</strong> one named variable controls more than one drawing argument.</div>`}
];
const deck=document.querySelector("#deck"),count=document.querySelector("#count");let n=Math.max(0,Math.min(slides.length-1,(+location.hash.slice(1)||1)-1));function show(i){n=(i+slides.length)%slides.length;const s=slides[n];deck.innerHTML=`<section class="slide ${s.dark?"dark":""}"><div class="eyebrow">${s.eye}</div><div class="time">${s.time}</div>${s.body}<span class="page">${n+1}</span></section>`;count.textContent=`${n+1} / ${slides.length}`;history.replaceState(null,"",`#${n+1}`)}prev.onclick=()=>show(n-1);next.onclick=()=>show(n+1);full.onclick=()=>document.documentElement.requestFullscreen?.();addEventListener("keydown",e=>{if(["ArrowRight","PageDown"," "].includes(e.key))show(n+1);if(["ArrowLeft","PageUp"].includes(e.key))show(n-1)});show(n);
</script></body></html>
