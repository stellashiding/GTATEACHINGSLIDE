function demoDoc(code){let safe=code.replace(/<\/script/gi,"<\\/script");return `<!doctype html><html><head><base href="${document.baseURI}"><style>html,body{margin:0;font:13px ui-monospace}body{height:100vh;display:flex;flex-direction:column;overflow:hidden}canvas{max-width:100%;height:auto!important}section{flex:1;min-height:105px;overflow:auto;background:#111;color:#ddd;padding:9px 12px}b{color:#ff6fa8}pre{white-space:pre-wrap}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"><\/script></head><body><section><b>Console</b><pre id="log">Starting p5.js…</pre></section><script>const el=document.querySelector('#log'),write=(level,a)=>{el.textContent+='\\n'+a.map(x=>x instanceof Error?x.message:String(x)).join(' ')};['log','warn','error'].forEach(level=>{const old=console[level];console[level]=(...a)=>{write(level,a);old(...a)}});addEventListener('error',e=>write('error',['✗',e.message]));addEventListener('unhandledrejection',e=>write('error',['✗',e.reason]));${safe}<\/script></body></html>`}
const deck=document.querySelector('#deck'),count=document.querySelector('#count');let n=Math.max(0,Math.min(slides.length-1,(+location.hash.slice(1)||1)-1)),timerId;
function quiz(){document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{let ok=b.dataset.ok==='1',f=document.querySelector('.feedback');document.querySelectorAll('.choice').forEach(x=>x.classList.remove('correct','wrong'));b.classList.add(ok?'correct':'wrong');f.className='feedback '+(ok?'good':'try');f.textContent=ok?'✓ Nice observation. Connect this visual clue to a design or coding choice.':'Try again—inspect the visual evidence.'})}
function timer(total){clearInterval(timerId);let left=total,on=false,out=document.querySelector('#timerReadout'),toggle=document.querySelector('#timerToggle'),reset=document.querySelector('#timerReset');const paint=()=>out.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');toggle.onclick=()=>{on=!on;toggle.textContent=on?'Pause':'Resume';clearInterval(timerId);if(on)timerId=setInterval(()=>{left--;paint();if(left<=0){clearInterval(timerId);on=false;toggle.textContent='Done'}},1000)};reset.onclick=()=>{clearInterval(timerId);on=false;left=total;toggle.textContent='Start';paint()};paint()}
function show(i){clearInterval(timerId);n=(i+slides.length)%slides.length;let s=slides[n];deck.innerHTML=`<section class="slide ${s.dark?'dark':''}"><div class="eye">${s.eye}</div><div class="time">${s.time}</div>${s.body}${s.timer?`<div class="timer"><strong id="timerReadout"></strong><button id="timerToggle">Start</button><button id="timerReset">Reset</button></div>`:''}<span class="page">${n+1}</span></section>`;count.textContent=`${n+1} / ${slides.length}`;history.replaceState(null,'',`#${n+1}`);if(s.quiz)quiz();if(s.timer)timer(s.timer);if(s.demo){let e=document.querySelector('#codeEditor'),p=document.querySelector('#preview');e.value=s.demo==='interactive'?interactiveCode:baseCode;let run=()=>p.srcdoc=demoDoc(e.value);document.querySelector('#runCode').onclick=run;run()}}
prev.onclick=()=>show(n-1);next.onclick=()=>show(n+1);full.onclick=()=>document.documentElement.requestFullscreen?.();addEventListener('keydown',e=>{if(['ArrowRight','PageDown'].includes(e.key))show(n+1);if(['ArrowLeft','PageUp'].includes(e.key))show(n-1)});show(n);
</script></body></html>
