  <script>
    const sampleData={docs:[
      {title:"The Creative Coding Handbook",first_publish_year:2018,edition_count:7},
      {title:"Generative Design",first_publish_year:2009,edition_count:14},
      {title:"Make: Getting Started with p5.js",first_publish_year:2015,edition_count:9},
      {title:"The Nature of Code",first_publish_year:2012,edition_count:12},
      {title:"Coding Art",first_publish_year:2021,edition_count:5},
      {title:"Creative Coding in Python",first_publish_year:2019,edition_count:4}
    ]};

    const apiDemoCode=`let libraryData;
const API_URL = "https://openlibrary.org/search.json?q=creative+coding&fields=title,first_publish_year,edition_count&limit=7";
const SAMPLE_URL = "assets/lab7/open-library-sample.json";

function preload() {
  const source = USE_SAMPLE_DATA ? SAMPLE_URL : API_URL;
  libraryData = loadJSON(
    source,
    data => console.log("Loaded", data.docs.length, "books"),
    () => {
      libraryData = SAMPLE_DATA;
      console.warn("Using the classroom sample.");
    }
  );
}

function setup() {
  createCanvas(620, 390);
  textFont("Arial");
  console.log("First record:", libraryData.docs[0]);
  noLoop();
}

function draw() {
  background(250);
  const books = libraryData.docs.slice(0, 7);

  fill(35);
  textSize(16);
  textStyle(BOLD);
  text("Creative coding books", 16, 25);
  textStyle(NORMAL);

  stroke(160);
  line(210, 50, width - 40, 50);
  noStroke();
  textSize(10);
  text("1990", 195, 43);
  text("2008", 380, 43);
  text("2026", width - 58, 43);

  for (let i = 0; i < books.length; i++) {
    const book = books[i];
    const y = 78 + i * 43;
    const x = map(book.first_publish_year, 1990, 2026, 210, width - 45, true);
    const size = map(book.edition_count, 0, 15, 10, 36, true);

    if (i % 2 === 0) {
      fill(242);
      rect(8, y - 18, width - 16, 36, 4);
    }
    fill(45);
    textSize(11);
    text(book.title.slice(0, 25), 16, y + 4);
    fill(237, 34, 93, 205);
    circle(x, y, size);
    fill(90);
    text(book.first_publish_year, x + 22, y + 4);
  }
}`;

    const detectiveArt=`<svg viewBox="0 0 760 410" role="img" aria-label="Six books shown as circles at different horizontal positions and sizes"><rect width="760" height="410" fill="#1a1023"/><g stroke="#4b3858" stroke-width="2"><path d="M70 350H700"/><path d="M100 345V355M250 345V355M400 345V355M550 345V355M700 345V355"/></g><g fill="#dccdd4" font-family="Arial" font-size="14" text-anchor="middle"><text x="100" y="378">1990</text><text x="250" y="378">2000</text><text x="400" y="378">2010</text><text x="550" y="378">2020</text><text x="700" y="378">2030</text></g><g fill="#ff3b82" fill-opacity=".82" stroke="#ff9fc1" stroke-width="3"><circle cx="205" cy="125" r="31"/><circle cx="380" cy="125" r="57"/><circle cx="520" cy="125" r="24"/><circle cx="315" cy="265" r="40"/><circle cx="565" cy="265" r="68"/><circle cx="660" cy="265" r="29"/></g><g fill="#fff" font-family="Arial" font-size="14" font-weight="700" text-anchor="middle"><text x="205" y="130">A</text><text x="380" y="130">B</text><text x="520" y="130">C</text><text x="315" y="270">D</text><text x="565" y="270">E</text><text x="660" y="270">F</text></g></svg>`;

    const slides=[
      {dark:1,eye:"Georgia Tech · Lab 7",body:`<h1>APIs, Data, and<br>Visual Mapping</h1><p class="lead">Today, data replaces the mouse: a field becomes position, size, color, or motion.</p><div class="cards"><div class="card"><h3>50 minutes</h3><p>Detect → inspect → map → build → explain</p></div><div class="card"><h3>Technical goal</h3><p>Find and access the field you need.</p></div><div class="card"><h3>Communication goal</h3><p>Make one mapping that says something.</p></div></div>`},
      {eye:"Data Mapping Detective · Opening",time:"4 minutes total",quiz:1,body:`<h2>What controls each circle’s size?</h2><div class="detective"><div class="viz">${detectiveArt}</div><div><div class="choices"><button class="choice" data-ok="0">The book title</button><button class="choice" data-ok="1">The number of editions</button><button class="choice" data-ok="0">The publication year</button></div><div class="feedback">Make a claim from the visual evidence. What might the x-position mean?</div></div></div>`},
      {eye:"Data Mapping Detective · Reveal",reveal:1,body:`<h2>Reverse-engineer the visual rules</h2><div class="mapping"><div class="field"><code>first_publish_year</code></div><div class="arrow">→</div><div class="property">x position</div><div class="field"><code>edition_count</code></div><div class="arrow">→</div><div class="property">circle size</div><div class="field"><code>title</code></div><div class="arrow">→</div><div class="property">text label</div></div><button class="reveal">Reveal the communication claim</button><div class="answer"><strong>Claim:</strong> larger circles suggest books with more editions, while the horizontal position helps us compare publication dates. The visual rules turn fields into evidence—not decoration.</div>`},
      {eye:"Assignment Framing",time:"2 minutes",body:`<h2>Build a small data-driven sketch</h2><div class="grid"><div class="card"><h3>Your sketch must</h3><ul class="checklist"><li>Load JSON or CSV data.</li><li>Log and inspect before drawing.</li><li>Access at least one repeated record.</li><li>Map a field to a visual property.</li></ul></div><div class="card"><h3>Your explanation must finish</h3><div class="prompt"><strong>“This data field controls this visual property because…”</strong></div><p class="small">Today’s boundary: no authentication, POST requests, Promises, advanced <code>fetch()</code>, or data-cleaning pipelines.</p></div></div>`},
      {eye:"Mental Model",time:"3 minutes",body:`<h2>From source to visual meaning</h2><div class="pipeline"><div class="step"><span>1</span><b>Source</b><small>API / CSV</small></div><div class="step"><span>2</span><b>Load</b><small>loadJSON / loadTable</small></div><div class="step"><span>3</span><b>Log + look</b><small>console</small></div><div class="step"><span>4</span><b>Access</b><small>docs[i].field</small></div><div class="step"><span>5</span><b>Map</b><small>input → range</small></div><div class="step"><span>6</span><b>Draw</b><small>shape / text</small></div><div class="step"><span>7</span><b>Explain</b><small>why it matters</small></div></div><div class="prompt"><strong>Memory phrase:</strong> load → log → look → access → map → draw.</div>`},
      {eye:"Choose the Loader",body:`<h2>Two sources, two p5.js loaders</h2><div class="grid"><div class="card"><span class="tag">JSON / API</span><pre class="code">let data;
function preload() {
  data = loadJSON(apiUrl);
}</pre><p>Often contains objects, arrays, and nested fields.</p></div><div class="card"><span class="tag">CSV</span><pre class="code">let table;
function preload() {
  table = loadTable(
    "weather.csv", "csv", "header"
  );
}</pre><p>Rows and columns. Access with <code>getNum()</code> or <code>getString()</code>.</p></div></div>`},
      {eye:"Inspect Before You Visualize",time:"3 minutes",quiz:1,body:`<h2>Where is the first book title?</h2><div class="grid"><pre class="code">{
  "numFound": 542,
  "docs": [
    {
      "title": "Creative Coding",
      "first_publish_year": 2018,
      "edition_count": 7
    }
  ]
}</pre><div><div class="choices"><button class="choice" data-ok="0"><code>data.title</code></button><button class="choice" data-ok="0"><code>data[0].title</code></button><button class="choice" data-ok="1"><code>data.docs[0].title</code></button></div><div class="feedback">Read one level at a time: object → array → first object → field.</div></div></div>`},
      {eye:"Access Pattern",body:`<h2>Read the path one step at a time</h2><div class="path"><span>data</span><i>→</i><span>.docs</span><i>→</i><span>[i]</span><i>→</i><span>.edition_count</span></div><div class="cards"><div class="card"><h3><code>data</code></h3><p>The whole response object.</p></div><div class="card"><h3><code>.docs[i]</code></h3><p>One book inside the array.</p></div><div class="card"><h3><code>.edition_count</code></h3><p>One number ready to map.</p></div></div><div class="prompt"><strong>Technical checkpoint:</strong> If a value is <code>undefined</code>, log the parent object and inspect its exact shape.</div>`},
      {eye:"Meaningful Mapping",time:"3 minutes",reveal:1,body:`<h2>A working mapping is not automatically a useful one</h2><div class="grid"><div class="card"><h3>Defensible choices</h3><ul><li>More editions → larger circle</li><li>Earlier year → farther left</li><li>Higher temperature → warmer color</li><li>More rainfall → denser marks</li></ul></div><div class="card"><h3>Ask before coding</h3><p>What comparison should viewers make?</p><p>Does the visual property reinforce that comparison?</p><p>Can I explain the rule in one sentence?</p></div></div><button class="reveal">Reveal the test</button><div class="answer"><strong>The “because” test:</strong> If you cannot finish “field → property because…”, the mapping may be arbitrary.</div>`},
      {eye:"Open Library · Predict Before Run",time:"2 minutes",body:`<h2>Predict the output before opening the demo</h2><div class="grid"><pre class="code">const x = map(
  book.first_publish_year,
  1990, 2026,
  210, width - 45,
  true
);

const size = map(
  book.edition_count,
  0, 15,
  10, 36,
  true
);</pre><div class="card"><h3>Turn and talk</h3><p>Where should a book from 1993 appear?</p><p>Which book receives the largest circle?</p><p>What does the final <code>true</code> do?</p></div></div>`},
      {eye:"Open Library · p5.js Canvas Demo",time:"6 minutes",demo:1,body:`<h2>Code on the left. Canvas on the right.</h2><p class="demo-note">Predict first: change the circle output range from <code>10, 36</code> to <code>6, 52</code>, then press ▶ Run. Each book gets its own row so labels stay readable.</p><div class="p5-shell"><div class="p5-menu"><span class="p5-logo">p5*</span><span>File</span><span>Edit</span><span>Sketch</span><span>Help</span></div><div class="p5-toolbar"><button class="p5-action" id="runCode" type="button" aria-label="Run sketch"><span class="play-icon"></span></button><button class="p5-action stop" id="stopCode" type="button" aria-label="Stop sketch"><span class="stop-icon"></span></button><label class="auto-refresh"><input id="autoRefresh" type="checkbox"> Auto-refresh</label><span class="sketch-name">lab7-data-mapping ✎</span><div class="source-switch"><button class="source-btn active" id="liveSource" type="button">Live API</button><button class="source-btn" id="sampleSource" type="button">Sample data</button></div><span class="p5-version">p5.js 1.11.3</span></div><div class="p5-workspace"><aside class="p5-files"><h3>Sketch files</h3><div class="file-item active">sketch.js</div><div class="file-item">open-library-sample.json</div><div class="file-item">index.html</div><div class="file-item">style.css</div></aside><section class="p5-code-column"><div class="editor-pane"><div class="pane-head"><strong>sketch.js</strong></div><div class="code-wrap"><pre class="line-numbers" id="lineNumbers" aria-hidden="true"></pre><textarea id="codeEditor" spellcheck="false" aria-label="Editable p5.js sketch code"></textarea></div></div><div class="p5-console"><div class="console-head"><strong>Console</strong><button id="clearConsole" type="button">Clear</button></div><pre class="console-output" id="demoConsole" aria-live="polite">Ready. Press ▶ Run.</pre></div></section><section class="preview-column"><div class="pane-head"><strong>Preview</strong></div><iframe class="preview" id="preview" title="p5.js canvas preview"></iframe></section></div></div>`},

console.log(data.docs);
console.log(data.docs[0]);
console.log(data.docs[0].edition_count);</pre><div class="card"><h3>Common symptoms</h3><ul><li><code>undefined</code> → wrong path or field name</li><li>blank canvas → inspect console first</li><li>all marks overlap → check mapped input values</li><li>API error → switch to the sample</li></ul></div></div>`},

    function demoDoc(code,useSample){
      const safe=code.replace(/<\/script/gi,"<\\/script");
      const fallback=JSON.stringify(sampleData).replace(/<\/script/gi,"<\\/script");
      return `<!doctype html><html><head><base href="${document.baseURI}"><style>html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f2f2f2}body{display:grid;place-items:center;overflow:auto;padding:12px}canvas{max-width:100%;height:auto!important;background:#fff;box-shadow:0 2px 10px #0002}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"><\/script></head><body><script>window.USE_SAMPLE_DATA=${useSample};window.SAMPLE_DATA=${fallback};const format=x=>{try{return typeof x==='object'?JSON.stringify(x):String(x)}catch{return String(x)}},send=(level,a)=>parent.postMessage({source:'lab7-p5-demo',level,text:a.map(format).join(' ')},'*');['log','warn','error'].forEach(level=>{const old=console[level];console[level]=(...a)=>{send(level,a);old(...a)}});addEventListener('error',e=>send('error',['✗',e.message]));addEventListener('unhandledrejection',e=>send('error',['✗',e.reason]));send('log',['Starting p5.js…']);${safe}<\/script></body></html>`;
    }

    const deck=document.querySelector('#deck');
    const count=document.querySelector('#count');
    const prev=document.querySelector('#prev');
    const next=document.querySelector('#next');
    const full=document.querySelector('#full');
    let n=Math.max(0,Math.min(slides.length-1,(Number(location.hash.slice(1))||1)-1));
    let timerId;
    let demoMessageHandler;

    function setupQuiz(){
      document.querySelectorAll('.choice').forEach(button=>{
        button.addEventListener('click',()=>{
          const correct=button.dataset.ok==='1';
          const feedback=document.querySelector('.feedback');
          document.querySelectorAll('.choice').forEach(item=>item.classList.remove('correct','wrong'));
          button.classList.add(correct?'correct':'wrong');
          feedback.className='feedback '+(correct?'good':'try');
          feedback.textContent=correct?'✓ Yes. Now explain what visual evidence supports that mapping.':'Try again—follow the object, array index, and field, or compare what visibly changes.';
        });
      });
    }

    function setupReveals(){
      document.querySelectorAll('.reveal').forEach(button=>{
        button.addEventListener('click',()=>{
          const answer=button.nextElementSibling;
          const open=answer.classList.toggle('show');
          button.textContent=open?'Hide answer':'Reveal answer';
        });
      });
    }

    function setupTimer(total){
      clearInterval(timerId);
      let left=total;
      let running=false;
      const out=document.querySelector('#timerReadout');
      const toggle=document.querySelector('#timerToggle');
      const reset=document.querySelector('#timerReset');
      const paint=()=>{out.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')};
      toggle.addEventListener('click',()=>{
        running=!running;
        toggle.textContent=running?'Pause':'Resume';
        clearInterval(timerId);
        if(running){
          timerId=setInterval(()=>{
            left=Math.max(0,left-1);
            paint();
            if(left===0){clearInterval(timerId);running=false;toggle.textContent='Done'}
          },1000);
        }
      });
      reset.addEventListener('click',()=>{clearInterval(timerId);running=false;left=total;toggle.textContent='Start';paint()});
      paint();
    }

    function setupDemo(){
      const editor=document.querySelector('#codeEditor');
      const preview=document.querySelector('#preview');
      const live=document.querySelector('#liveSource');
      const sample=document.querySelector('#sampleSource');
      const output=document.querySelector('#demoConsole');
      const lineNumbers=document.querySelector('#lineNumbers');
      const autoRefresh=document.querySelector('#autoRefresh');
      let useSample=false;
      let refreshId;
      editor.value=apiDemoCode;
      const updateLines=()=>{lineNumbers.textContent=editor.value.split('\n').map((_,index)=>index+1).join('\n')};
      const run=()=>{
        output.textContent=`Running with ${useSample?'sample data':'the live API'}…`;
        preview.srcdoc=demoDoc(editor.value,useSample);
      };
      const stop=()=>{
        preview.srcdoc='<!doctype html><html><body style="margin:0;background:#f2f2f2"></body></html>';
        output.textContent+='\n■ Sketch stopped.';
      };
      const selectSource=value=>{
        useSample=value;
        live.classList.toggle('active',!value);
        sample.classList.toggle('active',value);
        run();
      };
      demoMessageHandler=event=>{
        if(event.source!==preview.contentWindow||event.data?.source!=='lab7-p5-demo')return;
        const prefix=event.data.level==='error'?'✗ ':event.data.level==='warn'?'⚠ ':'';
        output.textContent+='\n'+prefix+event.data.text;
        output.scrollTop=output.scrollHeight;
      };
      addEventListener('message',demoMessageHandler);
      live.addEventListener('click',()=>selectSource(false));
      sample.addEventListener('click',()=>selectSource(true));
      document.querySelector('#runCode').addEventListener('click',run);
      document.querySelector('#stopCode').addEventListener('click',stop);
      document.querySelector('#clearConsole').addEventListener('click',()=>{output.textContent='Console cleared.'});
      editor.addEventListener('scroll',()=>{lineNumbers.scrollTop=editor.scrollTop});
      editor.addEventListener('input',()=>{
        updateLines();
        if(autoRefresh.checked){clearTimeout(refreshId);refreshId=setTimeout(run,500)}
      });
      editor.addEventListener('keydown',event=>{
        if(event.key!=='Tab')return;
        event.preventDefault();
        const start=editor.selectionStart;
        editor.setRangeText('  ',start,editor.selectionEnd,'end');
        updateLines();
      });
      updateLines();
      run();
    }

    function setupExit(){
      document.querySelector('#copyExit').addEventListener('click',async()=>{
        const field=document.querySelector('#fieldAnswer').value.trim()||'[field]';
        const visual=document.querySelector('#visualAnswer').value.trim()||'[visual property]';
        const because=document.querySelector('#becauseAnswer').value.trim()||'[reason]';
        const answer=`My data field is ${field}. It controls ${visual}. This is meaningful because ${because}.`;
        const status=document.querySelector('#copyStatus');
        try{await navigator.clipboard.writeText(answer);status.textContent='✓ Copied.'}
        catch{status.textContent='Copy unavailable here—select your three answers manually.'}
      });
    }

    function show(index){
      clearInterval(timerId);
      if(demoMessageHandler){removeEventListener('message',demoMessageHandler);demoMessageHandler=null}
      n=(index+slides.length)%slides.length;
      const slide=slides[n];
      deck.innerHTML=`<section class="slide ${slide.dark?'dark':''}"><div class="eye">${slide.eye}</div>${slide.time?`<div class="time">${slide.time}</div>`:''}${slide.body}${slide.timer?`<div class="timer"><strong id="timerReadout"></strong><button id="timerToggle" type="button">Start</button><button id="timerReset" type="button">Reset</button></div>`:''}<span class="page">${n+1}</span></section>`;
      count.textContent=`${n+1} / ${slides.length}`;
      history.replaceState(null,'',`#${n+1}`);
      if(slide.quiz)setupQuiz();
      if(slide.reveal)setupReveals();
      if(slide.timer)setupTimer(slide.timer);
      if(slide.demo)setupDemo();
      if(slide.exit)setupExit();
    }

    prev.addEventListener('click',()=>show(n-1));
    next.addEventListener('click',()=>show(n+1));
    full.addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.());
    addEventListener('keydown',event=>{
      if(['INPUT','TEXTAREA','BUTTON','A'].includes(event.target.tagName))return;
      if(['ArrowRight','PageDown',' '].includes(event.key)){event.preventDefault();show(n+1)}
      if(['ArrowLeft','PageUp'].includes(event.key)){event.preventDefault();show(n-1)}
    });
    addEventListener('hashchange',()=>{const target=Number(location.hash.slice(1));if(target&&target!==n+1)show(target-1)});
    show(n);
  </script>
</body>
</html>
