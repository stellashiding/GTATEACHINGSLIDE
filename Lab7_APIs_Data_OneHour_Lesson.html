  <script>
    const apiDemoCode=`let models;

function preload() {
  models = loadTable(
    "assets/lab7/generative-ai-models.csv",
    "csv", "header"
  );
}

function setup() {
  createCanvas(620, 390);
  console.log(models);
}

function draw() {
  background(245);

  let name = models.getString(0, "model");
  let month = models.getNum(0, "release_month");
  let context = models.getNum(0, "context_window_k");
  let size = map(context, 0, 2000, 40, 220);

  fill(237, 34, 93, 190);
  noStroke();
  circle(width / 2, height / 2, size);

  fill(30);
  textAlign(CENTER);
  textSize(22);
  text(name, width / 2, 55);
  textSize(14);
  text(month + "/2024 · " + context + "K context", width / 2, 82);
}`;

    const slides=[
      {dark:1,eye:"Georgia Tech · Lab 7",body:`<h1>Working with APIs<br>and Data</h1><p class="lead">Create an expressive or interactive p5.js sketch in which data controls the visual.</p><div class="cards"><div class="card"><h3>Load</h3><p>Bring in CSV or JSON data.</p></div><div class="card"><h3>Map</h3><p>Connect values to size, color, or position.</p></div><div class="card"><h3>Communicate</h3><p>Help viewers feel or notice something.</p></div></div>`},
      {eye:"Data Mapping Detective · Opening",time:"4 minutes",quiz:1,body:`<h2>Reverse-engineer the visual rules</h2><div class="detective"><div class="viz">${detectiveArt}</div><div><div class="choices"><button class="choice" data-ok="0">The model name</button><button class="choice" data-ok="1">The context window</button><button class="choice" data-ok="0">The organization</button></div><div class="feedback">What controls circle size? What might the x-position mean?</div><div class="answer quiz-answer"><strong>Visual rules:</strong><br><code>context_window_k</code> → circle size<br><code>release_month</code> → x position<br><code>model</code> → text label<br><br>Larger means a longer context window—not “better.”</div></div></div>`},
      {eye:"Assignment Framing",time:"2 minutes",body:`<h2>Create a data-driven artwork or exploration</h2><div class="grid"><div class="card"><h3>Requirements</h3><ul><li>Use <code>loadJSON()</code>, <code>loadTable()</code>, or another loading function.</li><li>Represent data visually or interactively.</li><li>Communicate something about the data.</li></ul></div><div class="card"><h3>Deliverables</h3><ul><li>One PDF: sketch link, 3–4 sentence description, and screenshot of sketch + code.</li><li>One uploaded video showing the interaction.</li></ul></div></div>`},
      {eye:"Finding Data",time:"4 minutes",body:`<h2>Where can you find a good dataset?</h2><div class="cards"><div class="card"><span class="tag">CSV</span><h3><a href="https://www.kaggle.com/datasets" target="_blank" rel="noreferrer">Kaggle Datasets ↗</a></h3><p>Look for a small table with clear column names. Load it with <code>loadTable()</code>.</p></div><div class="card"><span class="tag">JSON API</span><h3><a href="https://openlibrary.org/dev/docs/api/search" target="_blank" rel="noreferrer">Open Library ↗</a></h3><p>Search books and inspect the JSON response. Load it with <code>loadJSON()</code>.</p></div><div class="card"><span class="tag">JSON API</span><h3><a href="https://publicapis.io/wikidata-api" target="_blank" rel="noreferrer">Wikidata ↗</a></h3><p>Explore public knowledge across many topics, then inspect the returned fields.</p></div></div><div class="prompt"><strong>A good dataset:</strong> small enough to inspect · works with a p5.js loader · contains a field for size, color, or position · helps you finish “I want viewers to notice…”</div>`},
      {eye:"Mental Model",time:"3 minutes",body:`<h2>From source to visual meaning</h2><div class="pipeline"><div class="step"><span>1</span><b>Source</b><small>CSV / API</small></div><div class="step"><span>2</span><b>Load</b><small>loadTable / loadJSON</small></div><div class="step"><span>3</span><b>Log + look</b><small>console</small></div><div class="step"><span>4</span><b>Access</b><small>row + column</small></div><div class="step"><span>5</span><b>Map</b><small>input → range</small></div><div class="step"><span>6</span><b>Draw</b><small>shape / text</small></div><div class="step"><span>7</span><b>Explain</b><small>what to notice</small></div></div><div class="prompt"><strong>Memory phrase:</strong> load → log → look → access → map → draw.</div>`},
      {eye:"Choose the Loader",body:`<h2>Match the loader to the source</h2><div class="grid"><div class="card"><span class="tag">CSV</span><pre class="code">let models;

      {eye:"Inspect Before You Visualize",time:"3 minutes",quiz:1,body:`<h2>How do we access Gemini’s context window?</h2><div class="grid"><pre class="code">model,release_month,context_window_k

      {eye:"Access Pattern",body:`<h2>Read one row and one column</h2><div class="path"><span>models</span><i>→</i><span>row 0</span><i>→</i><span>"context_window_k"</span><i>→</i><span>2000</span></div><div class="grid"><pre class="code">let name = models.getString(

      {eye:"Meaningful Mapping",time:"3 minutes",reveal:1,body:`<h2>Decide what viewers should notice</h2><div class="grid"><div class="card"><h3>Generative AI model fields</h3><ul><li><code>context_window_k</code> → circle size</li><li><code>release_month</code> → x position</li><li><code>model</code> → text label</li></ul></div><div class="card"><h3>Ask before coding</h3><p>What comparison should viewers make?</p><p>Does the visual property support that comparison?</p><p>Can I explain the rule in one sentence?</p></div></div><button class="reveal">Reveal the test</button><div class="answer"><strong>The “because” test:</strong> “I mapped context-window length to circle size because larger marks make capacity easier to compare.”</div>`},

      {eye:"p5.js Canvas Demo · Level 1",time:"6 minutes",demo:1,body:`<h2>Start simple: one model, one circle</h2><p class="demo-note">Run the sketch, then change every row index from <code>0</code> to <code>4</code>. Predict the result before pressing ▶ again.</p><div class="p5-shell"><div class="p5-menu"><span class="p5-logo">p5*</span><span>File</span><span>Edit</span><span>Sketch</span><span>Help</span></div><div class="p5-toolbar"><button class="p5-action" id="runCode" type="button" aria-label="Run sketch"><span class="play-icon"></span></button><button class="p5-action stop" id="stopCode" type="button" aria-label="Stop sketch"><span class="stop-icon"></span></button><label class="auto-refresh"><input id="autoRefresh" type="checkbox"> Auto-refresh</label><span class="sketch-name">generative-ai-models ✎</span><span class="p5-version">p5.js 1.11.3</span></div><div class="p5-workspace"><aside class="p5-files"><h3>Sketch files</h3><div class="file-item active">sketch.js</div><div class="file-item">generative-ai-models.csv</div><div class="file-item">index.html</div><div class="file-item">style.css</div></aside><section class="p5-code-column"><div class="editor-pane"><div class="pane-head"><strong>sketch.js</strong></div><div class="code-wrap"><pre class="line-numbers" id="lineNumbers" aria-hidden="true"></pre><textarea id="codeEditor" spellcheck="false" aria-label="Editable p5.js sketch code"></textarea></div></div><div class="p5-console"><div class="console-head"><strong>Console</strong><button id="clearConsole" type="button">Clear</button></div><pre class="console-output" id="demoConsole" aria-live="polite">Ready. Press ▶ Run.</pre></div></section><section class="preview-column"><div class="pane-head"><strong>Preview</strong></div><iframe class="preview" id="preview" title="p5.js canvas preview"></iframe></section></div></div>`},

console.log(models.getNum(0, "context_window_k"));</pre><div class="card"><h3>If the sketch is blank</h3><ol><li>Read the console.</li><li>Check the CSV filename.</li><li>Copy the column header exactly.</li><li>Log one value before using <code>map()</code>.</li></ol></div></div>`},
      {eye:"Extended Activity · Optional Challenge",body:`<h2>Choose one challenge</h2><div class="cards"><div class="card"><h3>Add interaction</h3><p>Show a model label when the mouse moves over its circle.</p></div><div class="card"><h3>Add another mapping</h3><p>Use a second field to control color or position.</p></div><div class="card"><h3>Try a simple API</h3><p>Use <code>loadJSON()</code> with Open Library or Wikidata. Log the response before drawing.</p></div></div><div class="prompt"><strong>Keep the goal:</strong> the interaction or extra mapping should help viewers notice something about the data.</div>`},
      {dark:1,eye:"Student Build Sprint",time:"15 minutes",timer:900,body:`<h2>Build one clear data-driven sketch</h2><div class="cards"><div class="card"><h3>0–4 min · Load + inspect</h3><p>Confirm the data and log the field you want.</p></div><div class="card"><h3>4–10 min · Access + map</h3><p>Draw your marks and tune the output range.</p></div><div class="card"><h3>10–15 min · Explain + test</h3><p>Make the interaction or visual meaning easy to describe.</p></div></div><div class="prompt"><strong>Done means:</strong> data loads, a field controls a visual or interactive property, and the sketch communicates something.</div>`},
      {eye:"Guess My Mapping · Closer",time:"2 minutes",timer:120,body:`<h2>Show the visual. Hide the code.</h2><div class="cards"><div class="card"><h3>Viewer</h3><p>Guess the data field.</p></div><div class="card"><h3>Viewer</h3><p>Guess the visual property.</p></div><div class="card"><h3>Maker</h3><p>Reveal the rule and what viewers should notice.</p></div></div><div class="prompt"><strong>Listen for:</strong> “I think ___ controls ___ because I notice ___.”</div>`},
      {dark:1,eye:"Exit Ticket",time:"2 minutes",exit:1,body:`<h2>Complete the data-to-visual chain</h2><div class="grid"><div class="response"><label for="fieldAnswer">1. My data field is…</label><input id="fieldAnswer" placeholder="context_window_k"><label for="visualAnswer">2. It controls…</label><input id="visualAnswer" placeholder="circle size"><label for="becauseAnswer">3. This is meaningful because…</label><input id="becauseAnswer" placeholder="viewers can compare context-window length"><button class="copy" id="copyExit" type="button">Copy my exit ticket</button><div id="copyStatus" aria-live="polite"></div></div><div><div class="prompt"><strong>One last habit:</strong><br>Before drawing, I will <strong>load → log → look</strong>.</div><p class="small">Then: access → map → draw → explain.</p></div></div>`},
      {dark:1,eye:"Lab 7 · Recap",body:`<h1>Data controls the visual.</h1><div class="path"><span>source</span><i>→</i><span>inspect</span><i>→</i><span>field</span><i>→</i><span>property</span><i>→</i><span>meaning</span></div><p class="lead center">Make the code work—and make the mapping readable.</p><p class="center"><a class="download" href="assets/lab7/generative-ai-models.csv" download>Download the Generative AI model CSV</a></p>`}
    ];

    function demoDoc(code){
      const safe=code.replace(/<\/script/gi,"<\\/script");
      return `<!doctype html><html><head><base href="${document.baseURI}"><style>html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f2f2f2}body{display:grid;place-items:center;overflow:auto;padding:12px}canvas{max-width:100%;height:auto!important;background:#fff;box-shadow:0 2px 10px #0002}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"><\/script></head><body><script>const format=x=>{try{if(x&&typeof x.getRowCount==='function'&&Array.isArray(x.columns)){const rows=x.getRows().slice(0,3).map(row=>x.columns.map(column=>row.getString(column)).join(', '));return 'p5.Table ('+x.getRowCount()+' rows)\\n'+x.columns.join(', ')+'\\n'+rows.join('\\n')}return typeof x==='object'?JSON.stringify(x):String(x)}catch{return String(x)}},send=(level,a)=>parent.postMessage({source:'lab7-p5-demo',level,text:a.map(format).join(' ')},'*');['log','warn','error'].forEach(level=>{const old=console[level];console[level]=(...a)=>{send(level,a);old(...a)}});addEventListener('error',e=>send('error',['✗',e.message]));addEventListener('unhandledrejection',e=>send('error',['✗',e.reason]));send('log',['Starting p5.js…']);${safe}<\/script></body></html>`;
    }

    const deck=document.querySelector('#deck');
    const count=document.querySelector('#count');
    const prev=document.querySelector('#prev');
    const next=document.querySelector('#next');
    const full=document.querySelector('#full');
    let n=Math.max(0,Math.min(slides.length-1,(Number(location.hash.slice(1))||1)-1));
    let timerId;
    let demoMessageHandler;

    function setupQuiz(){
      document.querySelectorAll('.choice').forEach(button=>{
        button.addEventListener('click',()=>{
          const correct=button.dataset.ok==='1';
          const feedback=document.querySelector('.feedback');
          document.querySelectorAll('.choice').forEach(item=>item.classList.remove('correct','wrong'));
          button.classList.add(correct?'correct':'wrong');
          feedback.className='feedback '+(correct?'good':'try');
          feedback.textContent=correct?'✓ Yes. Now explain what visual evidence supports that mapping.':'Try again—follow the object, array index, and field, or compare what visibly changes.';
          const answer=document.querySelector('.quiz-answer');
          if(answer)answer.classList.toggle('show',correct);
        });
      });
    }

    function setupReveals(){
      document.querySelectorAll('.reveal').forEach(button=>{
        button.addEventListener('click',()=>{
          const answer=button.nextElementSibling;
          const open=answer.classList.toggle('show');
          button.textContent=open?'Hide answer':'Reveal answer';
        });
      });
    }

    function setupTimer(total){
      clearInterval(timerId);
      let left=total;
      let running=false;
      const out=document.querySelector('#timerReadout');
      const toggle=document.querySelector('#timerToggle');
      const reset=document.querySelector('#timerReset');
      const paint=()=>{out.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')};
      toggle.addEventListener('click',()=>{
        running=!running;
        toggle.textContent=running?'Pause':'Resume';
        clearInterval(timerId);
        if(running){
          timerId=setInterval(()=>{
            left=Math.max(0,left-1);
            paint();
            if(left===0){clearInterval(timerId);running=false;toggle.textContent='Done'}
          },1000);
        }
      });
      reset.addEventListener('click',()=>{clearInterval(timerId);running=false;left=total;toggle.textContent='Start';paint()});
      paint();
    }

    function setupDemo(){
      const editor=document.querySelector('#codeEditor');
      const preview=document.querySelector('#preview');
      const output=document.querySelector('#demoConsole');
      const lineNumbers=document.querySelector('#lineNumbers');
      const autoRefresh=document.querySelector('#autoRefresh');
      let refreshId;
      editor.value=apiDemoCode;
      const updateLines=()=>{lineNumbers.textContent=editor.value.split('\n').map((_,index)=>index+1).join('\n')};
      const run=()=>{
        output.textContent='Running sketch…';
        preview.srcdoc=demoDoc(editor.value);
      };
      const stop=()=>{
        preview.srcdoc='<!doctype html><html><body style="margin:0;background:#f2f2f2"></body></html>';
        output.textContent+='\n■ Sketch stopped.';
      };
      demoMessageHandler=event=>{
        if(event.source!==preview.contentWindow||event.data?.source!=='lab7-p5-demo')return;
        const prefix=event.data.level==='error'?'✗ ':event.data.level==='warn'?'⚠ ':'';
        output.textContent+='\n'+prefix+event.data.text;
        output.scrollTop=output.scrollHeight;
      };
      addEventListener('message',demoMessageHandler);
      document.querySelector('#runCode').addEventListener('click',run);
      document.querySelector('#stopCode').addEventListener('click',stop);
      document.querySelector('#clearConsole').addEventListener('click',()=>{output.textContent='Console cleared.'});
      editor.addEventListener('scroll',()=>{lineNumbers.scrollTop=editor.scrollTop});
      editor.addEventListener('input',()=>{
        updateLines();
        if(autoRefresh.checked){clearTimeout(refreshId);refreshId=setTimeout(run,500)}
      });
      editor.addEventListener('keydown',event=>{
        if(event.key!=='Tab')return;
        event.preventDefault();
        const start=editor.selectionStart;
        editor.setRangeText('  ',start,editor.selectionEnd,'end');
        updateLines();
      });
      updateLines();
      run();
    }

    function setupExit(){
      document.querySelector('#copyExit').addEventListener('click',async()=>{
        const field=document.querySelector('#fieldAnswer').value.trim()||'[field]';
        const visual=document.querySelector('#visualAnswer').value.trim()||'[visual property]';
        const because=document.querySelector('#becauseAnswer').value.trim()||'[reason]';
        const answer=`My data field is ${field}. It controls ${visual}. This is meaningful because ${because}.`;
        const status=document.querySelector('#copyStatus');
        try{await navigator.clipboard.writeText(answer);status.textContent='✓ Copied.'}
        catch{status.textContent='Copy unavailable here—select your three answers manually.'}
      });
    }

    function show(index){
      clearInterval(timerId);
      if(demoMessageHandler){removeEventListener('message',demoMessageHandler);demoMessageHandler=null}
      n=(index+slides.length)%slides.length;
      const slide=slides[n];
      deck.innerHTML=`<section class="slide ${slide.dark?'dark':''}"><div class="eye">${slide.eye}</div>${slide.time?`<div class="time">${slide.time}</div>`:''}${slide.body}${slide.timer?`<div class="timer"><strong id="timerReadout"></strong><button id="timerToggle" type="button">Start</button><button id="timerReset" type="button">Reset</button></div>`:''}<span class="page">${n+1}</span></section>`;
      count.textContent=`${n+1} / ${slides.length}`;
      history.replaceState(null,'',`#${n+1}`);
      if(slide.quiz)setupQuiz();
      if(slide.reveal)setupReveals();
      if(slide.timer)setupTimer(slide.timer);
      if(slide.demo)setupDemo();
      if(slide.exit)setupExit();
    }

    prev.addEventListener('click',()=>show(n-1));
    next.addEventListener('click',()=>show(n+1));
    full.addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.());
    addEventListener('keydown',event=>{
      if(['INPUT','TEXTAREA','BUTTON','A'].includes(event.target.tagName))return;
      if(['ArrowRight','PageDown',' '].includes(event.key)){event.preventDefault();show(n+1)}
      if(['ArrowLeft','PageUp'].includes(event.key)){event.preventDefault();show(n-1)}
    });
    addEventListener('hashchange',()=>{const target=Number(location.hash.slice(1));if(target&&target!==n+1)show(target-1)});
    show(n);
  </script>
</body>
</html>
