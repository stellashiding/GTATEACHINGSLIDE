px solid #c7c7c7;background:#f3f3f3;color:#555;font-size:12px}.p5-files h3{margin:0;padding:10px;border-bottom:1px solid #ccc;font-size:12px}.file-item{display:block;width:100%;padding:7px 9px;border:0;background:transparent;color:#555;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.file-item.active{background:#ddd;color:#111;font-weight:800}.file-item::before{content:"▱";margin-right:6px;color:#777}.file-item.active::before{content:"◆";color:#ed225d;font-size:8px}.p5-code-column{display:grid;grid-template-rows:minmax(0,1fr) 104px;min-width:0;min-height:0;height:100%;overflow:hidden;border-right:1px solid #c7c7c7}.editor-pane{display:flex;flex-direction:column;min-height:0;overflow:hidden}.pane-head{height:30px;flex:0 0 30px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid #ccc;background:#f5f5f5;color:#555;font-size:12px}.pane-head strong{color:#333}.code-wrap{display:grid;grid-template-columns:42px 1fr;min-height:0;overflow:hidden;flex:1;background:#fff}.line-numbers{height:100%;margin:0;padding:10px 8px;border-right:1px solid #ddd;overflow:hidden;background:#f6f6f6;color:#999;text-align:right;font:12px/1.42 ui-monospace,monospace;user-select:none}.code-wrap textarea{width:100%;height:100%;min-height:0;resize:none;border:0;outline:0;padding:10px 12px;background:#fff;color:#252525;font:12px/1.42 ui-monospace,monospace;tab-size:2;white-space:pre}.p5-console{display:flex;flex-direction:column;min-height:0;overflow:hidden;border-top:1px solid #bbb;background:#f1f1f1}.console-head{height:27px;flex:0 0 27px;display:flex;align-items:center;padding:0 9px;background:#d9d9d9;color:#333;font-size:12px}.console-head button{margin-left:auto;border:0;background:transparent;color:#555;font-size:11px;cursor:pointer}.console-output{flex:1;margin:0;padding:7px 10px;overflow:auto;color:#333;font:11px/1.35 ui-monospace,monospace;white-space:pre-wrap}.preview-column{display:flex;flex-direction:column;min-width:0;min-heigh   <script>
    const P5_VERSION="1.11.3";
    const starterJson=`{
  "entries": [
    {
      "tool": "ChatGPT",
      "task": "brainstorming",
      "minutes": 25
    },
    {
      "tool": "Claude",
      "task": "reading",
      "minutes": 40
    }
  ]
}`;

    const starterSketch=`function setup() {
  createCanvas(600, 400);
}

    const loadSketch=`let journal;

function preload() {
  journal = loadJSON("my-ai-use.json");
}

function setup() {
  createCanvas(600, 400);
  console.log(journal);
  noLoop();
}

  background(240);

    const oneCircleSketch=`let journal;

function preload() {
  journal = loadJSON("my-ai-use.json");
}

function setup() {
  createCanvas(600, 400);
  console.log(journal);
}

function draw() {
  background(240);

  let entry = journal.entries[0];
  let size = entry.minutes * 4;

  fill(237, 34, 93, 190);
  noStroke();
  circle(width / 2, 230, size);

  fill(30);
  textAlign(CENTER);
  textSize(22);
  text(entry.tool, width / 2, 60);
  textSize(15);
  text(entry.task + " · " + entry.minutes + " min", width / 2, 88);
}`;

    const allCirclesSketch=`let journal;

function preload() {
  journal = loadJSON("my-ai-use.json");
}

function setup() {
  createCanvas(600, 400);
  console.log(journal);
}

function draw() {
  background(240);
  textAlign(CENTER);

  for (let i = 0; i < journal.entries.length; i++) {
    let entry = journal.entries[i];
    let x = width / (journal.entries.length + 1) * (i + 1);
    let size = entry.minutes * 3;

    fill(237, 34, 93, 180);
    noStroke();
    circle(x, 225, size);

    fill(30);
    textSize(16);
    text(entry.tool, x, 60);
    textSize(12);
    text(entry.task, x, 82);
    text(entry.minutes + " min", x, 102);
  }
}`;

    const demoProject={"sketch.js":starterSketch};
    let activeDemoFile="sketch.js";

    function p5DemoShell(){
      return `<div class="p5-shell">
        <div class="p5-menu">
          <span class="p5-logo">p5*</span>
          <button class="p5-menu-button" id="fileMenuButton" type="button">File</button>
          <button class="p5-menu-button" type="button">Edit</button>
          <button class="p5-menu-button" type="button">Sketch</button>
          <button class="p5-menu-button" type="button">Help</button>
          <div class="file-menu-popup hide" id="fileMenuPopup"><button id="addDemoFile" type="button">Add File…</button></div>
        </div>
        <div class="p5-toolbar">
          <button class="p5-action" id="runCode" type="button" aria-label="Run sketch"><span class="play-icon"></span></button>
          <button class="p5-action stop" id="stopCode" type="button" aria-label="Stop sketch"><span class="stop-icon"></span></button>
          <label class="auto-refresh"><input id="autoRefresh" type="checkbox"> Auto-refresh</label>
          <span class="sketch-name">my-ai-use-visualization ✎</span>
          <select class="p5-version" id="p5Version" aria-label="p5.js version"><option>p5.js 1.11.3</option></select>
        </div>
        <div class="p5-workspace">
          <aside class="p5-files"><h3>Sketch files</h3><div id="demoFileList"></div></aside>
          <section class="p5-code-column">
            <div class="editor-pane">
              <div class="pane-head"><strong id="activeFileName">sketch.js</strong></div>
              <div class="code-wrap"><pre class="line-numbers" id="lineNumbers" aria-hidden="true"></pre><textarea id="codeEditor" spellcheck="false" aria-label="Editable p5.js project file"></textarea></div>
            </div>
            <div class="p5-console"><div class="console-head"><strong>Console</strong><button id="clearConsole" type="button">Clear</button></div><pre class="console-output" id="demoConsole" aria-live="polite">Ready.</pre></div>
          </section>
          <section class="preview-column"><div class="pane-head"><strong>Preview</strong></div><iframe class="preview" id="preview" title="p5.js canvas preview"></iframe></section>
        </div>
      </div>`;
    }

    const aiUseArt=`<svg viewBox="0 0 760 410" role="img" aria-label="Three AI-use activities represented by circles of different sizes">
      <rect width="760" height="410" fill="#1a1023"/>
      <g fill="#ed225d" fill-opacity=".84" stroke="#ff9fc1" stroke-width="3">
        <circle cx="145" cy="220" r="62"/><circle cx="380" cy="220" r="98"/><circle cx="615" cy="220" r="40"/>
      </g>
      <g fill="#fff" font-family="Arial" text-anchor="middle">
        <text x="145" y="80" font-size="19" font-weight="700">ChatGPT</text><text x="145" y="105" font-size="14">brainstorming</text>
        <text x="380" y="80" font-size="19" font-weight="700">Claude</text><text x="380" y="105" font-size="14">reading</text>
        <text x="615" y="80" font-size="19" font-weight="700">Gemini</text><text x="615" y="105" font-size="14">image ideas</text>
      </g>
    </svg>`;

    const slides=[
      {dark:1,eye:"Georgia Tech · Lab 7",body:`<h1>Create, Load, and<br>Visualize Your Own Data</h1><p class="lead">Build a small JSON dataset in p5.js and make its values control the visual.</p><div class="path"><span>create</span><i>→</i><span>load</span><i>→</i><span>inspect</span><i>→</i><span>visualize</span><i>→</i><span>revise</span></div>`},
      {eye:"Warm-up · Notice the Mapping",time:"4 minutes",quiz:1,body:`<h2>What controls the size of each circle?</h2><div class="detective"><div class="viz">${aiUseArt}</div><div><div class="choices"><button class="choice" data-ok="0">The AI tool</button><button class="choice" data-ok="0">The task name</button><button class="choice" data-ok="1">Minutes spent</button></div><div class="feedback">Look for a numeric field that could become a visual size.</div><div class="answer quiz-answer"><strong>Visual rules:</strong><br><code>minutes</code> → circle size<br><code>tool</code> → main label<br><code>task</code> → description<br><br>Today you will create this data yourself.</div></div></div>`},
      {eye:"Data Literacy · Before Coding",time:"5 minutes",body:`<h2>How do we choose a good data source?</h2><div class="grid"><div class="card"><h3>Possible sources</h3><ul><li><strong>Your own observations:</strong> habits, media, exercise, AI use</li><li><strong>Public/open data:</strong> government, museums, universities</li><li><strong>Dataset repositories:</strong> downloadable CSV or JSON</li><li><strong>APIs:</strong> books, weather, public information</li></ul></div><div class="card"><h3>Check before using</h3><ul class="checklist"><li>Relevant to your question</li><li>Reliable creator and date</li><li>Clear fields and units</li><li>Small enough to inspect</li><li>Complete enough to use</li><li>Safe, ethical, and non-sensitive</li></ul></div></div><div class="prompt"><strong>Today’s good source:</strong> 2–4 observations you create yourself. The fields are clear, the scope is manageable, and you control what personal information is included.</div>`},
      {eye:"Set Up the Same Environment",time:"2 minutes",body:`<h2>Confirm the p5.js version first</h2><div class="grid"><div class="card"><span class="tag green">LOCKED VERSION</span><h3>p5.js 1.11.3</h3><p>Teacher demo, embedded preview, and student projects should all use the same version.</p></div><div class="card"><h3>Before we begin</h3><ol><li>Open a new p5.js Web Editor project.</li><li>Find the version selector.</li><li>Select <strong>p5.js 1.11.3</strong>.</li><li>Keep the default <code>sketch.js</code>.</li></ol></div></div><div class="prompt"><strong>Why lock it?</strong> The same code should behave the same way on every screen.</div>`},
      {eye:"p5.js Demo 1 · Create the Data File",time:"7 minutes",demo:"create",body:`<h2>Create <code>my-ai-use.json</code> inside p5.js</h2><p class="demo-note"><strong>Live steps:</strong> File → Add File… → enter <code>my-ai-use.json</code> → type two entries → add one of your own. Do not download anything.</p>${p5DemoShell()}`},
      {eye:"p5.js Demo 2 · Load + Inspect",time:"5 minutes",demo:"load",body:`<h2>Load the file before drawing</h2><p class="demo-note">Switch to <code>sketch.js</code>. Run <code>loadJSON("my-ai-use.json")</code>, then inspect the object in the Console.</p>${p5DemoShell()}`},
      {eye:"Access One Value",time:"3 minutes",body:`<h2>Follow the path to the number</h2><div class="path"><span>journal</span><i>→</i><span>entries</span><i>→</i><span>[0]</span><i>→</i><span>minutes</span><i>→</i><span>25</span></div><div class="grid"><pre class="code">let entry = journal.entries[0];
let size = entry.minutes * 4;</pre><div class="card"><h3>Read it aloud</h3><p>“From <code>journal</code>, open <code>entries</code>, choose the first entry, and read its <code>minutes</code>.”</p><p><code>* 4</code> turns a small number of minutes into a visible circle size.</p></div></div>`},
      {eye:"p5.js Demo 3 · Visualize One Entry",time:"4 minutes",demo:"one",body:`<h2>One entry → one circle</h2><p class="demo-note">Change the first entry’s <code>minutes</code> in <code>my-ai-use.json</code>, return to <code>sketch.js</code>, and press ▶ again.</p>${p5DemoShell()}`},
      {eye:"p5.js Demo 4 · Visualize Every Entry",time:"3 minutes",demo:"all",body:`<h2>A loop draws every entry you create</h2><p class="demo-note">The loop uses <code>journal.entries.length</code>. Add a third JSON entry and rerun—the visualization should add a third circle.</p>${p5DemoShell()}`},
      {dark:1,eye:"Student Build Sprint",time:"12 minutes",timer:720,body:`<h2>Create your own data-driven sketch</h2><div class="cards"><div class="card"><h3>0–4 min · Create</h3><p>Write 2–4 valid JSON entries with <code>tool</code>, <code>task</code>, and <code>minutes</code>.</p></div><div class="card"><h3>4–8 min · Load</h3><p>Use <code>loadJSON()</code>. Run and confirm the object appears in the Console.</p></div><div class="card"><h3>8–12 min · Visualize</h3><p>Let <code>minutes</code> control circle size. Change a value and rerun.</p></div></div><div class="prompt"><strong>Core success:</strong> your file loads, one numeric field controls a visual property, and you can explain the rule.<br><strong>If it breaks:</strong> check the filename, quotation marks, commas, brackets, and Console message.</div>`},
      {eye:"Pair Share · Guess My Mapping",time:"2 minutes",timer:120,body:`<h2>Show the visual before showing the code</h2><div class="cards"><div class="card"><h3>Viewer</h3><p>Guess which data field controls size.</p></div><div class="card"><h3>Maker</h3><p>Reveal the JSON and explain the rule.</p></div><div class="card"><h3>Together</h3><p>Suggest one responsible data source for a future sketch.</p></div></div><div class="prompt"><strong>Sentence frame:</strong> “I mapped ___ to ___ because I wanted viewers to notice ___.”</div>`},
      {dark:1,eye:"Exit Ticket",time:"3 minutes",exit:1,body:`<h2>Complete the data-to-visual chain</h2><div class="grid"><div class="response"><label for="fieldAnswer">1. My data field is…</label><input id="fieldAnswer" placeholder="minutes"><label for="visualAnswer">2. It controls…</label><input id="visualAnswer" placeholder="circle size"><label for="becauseAnswer">3. This is meaningful because…</label><input id="becauseAnswer" placeholder="viewers can compare how I used different tools"><button class="copy" id="copyExit" type="button">Copy my exit ticket</button><div id="copyStatus" aria-live="polite"></div></div><div><div class="prompt"><strong>One last habit:</strong><br>Create → load → log → look → access → draw → revise.</div><p class="small">A good visualization makes its data-to-visual rule understandable.</p></div></div>`}
    ];

    function demoDoc(code,jsonText){
      const jsonUrl="data:application/json;charset=utf-8,"+encodeURIComponent(jsonText||"{}");
      const runnable=code.replace(/loadJSON\(\s*["']my-ai-use\.json["']\s*\)/g,`loadJSON(${JSON.stringify(jsonUrl)})`);
      const safe=runnable.replace(/<\/script/gi,"<\\/script");
      return `<!doctype html><html><head><style>html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f2f2f2}body{display:grid;place-items:center;overflow:auto;padding:12px}canvas{max-width:100%;height:auto!important;background:#fff;box-shadow:0 2px 10px #0002}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"><\/script></head><body><script>const format=x=>{try{return typeof x==='object'?JSON.stringify(x,null,2):String(x)}catch{return String(x)}},send=(level,a)=>parent.postMessage({source:'lab7-p5-demo',level,text:a.map(format).join(' ')},'*');['log','warn','error'].forEach(level=>{const old=console[level];console[level]=(...a)=>{send(level,a);old(...a)}});addEventListener('error',e=>send('error',['✗',e.message]));addEventListener('unhandledrejection',e=>send('error',['✗',e.reason]));send('log',['Running with p5.js 1.11.3']);${safe}<\/script></body></html>`;
    }

    const deck=document.querySelector('#deck');
    const count=document.querySelector('#count');
    const prev=document.querySelector('#prev');
    const next=document.querySelector('#next');
    const full=document.querySelector('#full');
    let n=Math.max(0,Math.min(slides.length-1,(Number(location.hash.slice(1))||1)-1));
    let timerId;
    let demoMessageHandler;

    function setupQuiz(){
      document.querySelectorAll('.choice').forEach(button=>{
        button.addEventListener('click',()=>{
          const correct=button.dataset.ok==='1';
          const feedback=document.querySelector('.feedback');
          document.querySelectorAll('.choice').forEach(item=>item.classList.remove('correct','wrong'));
          button.classList.add(correct?'correct':'wrong');
          feedback.className='feedback '+(correct?'good':'try');
          feedback.textContent=correct?'✓ Yes. The largest circle represents the most minutes.':'Try again—look for the numeric field that could reasonably control size.';
          const answer=document.querySelector('.quiz-answer');
          if(answer)answer.classList.toggle('show',correct);
        });
      });
    }

    function setupReveals(){
      document.querySelectorAll('.reveal').forEach(button=>{
        button.addEventListener('click',()=>{
          const answer=button.nextElementSibling;
          const open=answer.classList.toggle('show');
          button.textContent=open?'Hide answer':'Reveal answer';
        });
      });
    }

    function setupTimer(total){
      clearInterval(timerId);
      let left=total;
      let running=false;
      const out=document.querySelector('#timerReadout');
      const toggle=document.querySelector('#timerToggle');
      const reset=document.querySelector('#timerReset');
      const paint=()=>{out.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')};
      toggle.addEventListener('click',()=>{
        running=!running;
        toggle.textContent=running?'Pause':'Resume';
        clearInterval(timerId);
        if(running){
          timerId=setInterval(()=>{
            left=Math.max(0,left-1);
            paint();
            if(left===0){clearInterval(timerId);running=false;toggle.textContent='Done'}
          },1000);
        }
      });
      reset.addEventListener('click',()=>{clearInterval(timerId);running=false;left=total;toggle.textContent='Start';paint()});
      paint();
    }

    function setupDemo(mode){
      const editor=document.querySelector('#codeEditor');
      const preview=document.querySelector('#preview');
      const output=document.querySelector('#demoConsole');
      const lineNumbers=document.querySelector('#lineNumbers');
      const autoRefresh=document.querySelector('#autoRefresh');
      const fileList=document.querySelector('#demoFileList');
      const activeFileName=document.querySelector('#activeFileName');
      const fileMenuButton=document.querySelector('#fileMenuButton');
      const fileMenuPopup=document.querySelector('#fileMenuPopup');
      const addDemoFile=document.querySelector('#addDemoFile');
      let refreshId;

      if(mode!=="create"&&!demoProject["my-ai-use.json"])demoProject["my-ai-use.json"]=starterJson;
      if(mode==="load")demoProject["sketch.js"]=loadSketch;
      if(mode==="one")demoProject["sketch.js"]=oneCircleSketch;
      if(mode==="all")demoProject["sketch.js"]=allCirclesSketch;
      if(mode!=="create")activeDemoFile="sketch.js";

      const updateLines=()=>{lineNumbers.textContent=editor.value.split('\n').map((_,index)=>index+1).join('\n')};
      const saveActive=()=>{demoProject[activeDemoFile]=editor.value};
      const selectFile=name=>{
        saveActive();
        activeDemoFile=name;
        editor.value=demoProject[name];
        activeFileName.textContent=name;
        renderFiles();
        updateLines();
      };
      const renderFiles=()=>{
        fileList.innerHTML="";
        Object.keys(demoProject).forEach(name=>{
          const button=document.createElement("button");
          button.type="button";
          button.className="file-item"+(name===activeDemoFile?" active":"");
          button.textContent=name;
          button.addEventListener("click",()=>selectFile(name));
          fileList.appendChild(button);
        });
      };
      const run=()=>{
        saveActive();
        const code=demoProject["sketch.js"];
        const jsonText=demoProject["my-ai-use.json"]||"";
        if(/loadJSON\s*\(/.test(code)){
          if(!jsonText){
            output.textContent='✗ Create my-ai-use.json first: File → Add File…';
            return;
          }
          try{JSON.parse(jsonText)}
          catch(error){
            output.textContent='✗ JSON error: '+error.message+'\nCheck quotation marks, commas, braces, and brackets.';
            return;
          }
        }
        output.textContent='Running sketch…';
        preview.srcdoc=demoDoc(code,jsonText);
      };
      const stop=()=>{
        preview.srcdoc='<!doctype html><html><body style="margin:0;background:#f2f2f2"></body></html>';
        output.textContent+='\n■ Sketch stopped.';
      };
      demoMessageHandler=event=>{
        if(event.source!==preview.contentWindow||event.data?.source!=='lab7-p5-demo')return;
        const prefix=event.data.level==='error'?'✗ ':event.data.level==='warn'?'⚠ ':'';
        output.textContent+='\n'+prefix+event.data.text;
        output.scrollTop=output.scrollHeight;
      };
      addEventListener('message',demoMessageHandler);
      document.querySelector('#runCode').addEventListener('click',run);
      document.querySelector('#stopCode').addEventListener('click',stop);
      document.querySelector('#clearConsole').addEventListener('click',()=>{output.textContent='Console cleared.'});
      fileMenuButton.addEventListener('click',()=>fileMenuPopup.classList.toggle('hide'));
      addDemoFile.addEventListener('click',()=>{
        fileMenuPopup.classList.add('hide');
        const requested=prompt('Name the new file:','my-ai-use.json');
        if(!requested)return;
        const name=requested.trim();
        if(!name)return;
        if(!demoProject[name])demoProject[name]=name==="my-ai-use.json"?"":``;
        selectFile(name);
        if(name==="my-ai-use.json"&&!editor.value){
          output.textContent='File created. Type the JSON data shown above, then switch back to sketch.js.';
        }
      });
      editor.addEventListener('scroll',()=>{lineNumbers.scrollTop=editor.scrollTop});
      editor.addEventListener('input',()=>{
        saveActive();
        updateLines();
        if(autoRefresh.checked){clearTimeout(refreshId);refreshId=setTimeout(run,500)}
      });
      editor.addEventListener('keydown',event=>{
        if(event.key!=='Tab')return;
        event.preventDefault();
        const start=editor.selectionStart;
        editor.setRangeText('  ',start,editor.selectionEnd,'end');
        saveActive();
        updateLines();
      });
      renderFiles();
      editor.value=demoProject[activeDemoFile];
      activeFileName.textContent=activeDemoFile;
      updateLines();
      if(mode==="create"){
        output.textContent=demoProject["my-ai-use.json"]?'JSON file ready. Edit it, then switch to sketch.js.':'Use File → Add File… to create my-ai-use.json.';
      }else{
        run();
      }
    }

    function setupExit(){
      document.querySelector('#copyExit').addEventListener('click',async()=>{
        const field=document.querySelector('#fieldAnswer').value.trim()||'[field]';
        const visual=document.querySelector('#visualAnswer').value.trim()||'[visual property]';
        const because=document.querySelector('#becauseAnswer').value.trim()||'[reason]';
        const answer=`My data field is ${field}. It controls ${visual}. This is meaningful because ${because}.`;
        const status=document.querySelector('#copyStatus');
        try{await navigator.clipboard.writeText(answer);status.textContent='✓ Copied.'}
        catch{status.textContent='Copy unavailable here—select your three answers manually.'}
      });
    }

    function show(index){
      clearInterval(timerId);
      if(demoMessageHandler){removeEventListener('message',demoMessageHandler);demoMessageHandler=null}
      n=(index+slides.length)%slides.length;
      const slide=slides[n];
      deck.innerHTML=`<section class="slide ${slide.dark?'dark':''}"><div class="eye">${slide.eye}</div>${slide.time?`<div class="time">${slide.time}</div>`:''}${slide.body}${slide.timer?`<div class="timer"><strong id="timerReadout"></strong><button id="timerToggle" type="button">Start</button><button id="timerReset" type="button">Reset</button></div>`:''}<span class="page">${n+1}</span></section>`;
      count.textContent=`${n+1} / ${slides.length}`;
      history.replaceState(null,'',`#${n+1}`);
      if(slide.quiz)setupQuiz();
      if(slide.reveal)setupReveals();
      if(slide.timer)setupTimer(slide.timer);
      if(slide.demo)setupDemo(slide.demo);
      if(slide.exit)setupExit();
    }

    prev.addEventListener('click',()=>show(n-1));
    next.addEventListener('click',()=>show(n+1));
    full.addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.());
    addEventListener('keydown',event=>{
      if(['INPUT','TEXTAREA','BUTTON','A'].includes(event.target.tagName))return;
      if(['ArrowRight','PageDown',' '].includes(event.key)){event.preventDefault();show(n+1)}
      if(['ArrowLeft','PageUp'].includes(event.key)){event.preventDefault();show(n-1)}
    });
    addEventListener('hashchange',()=>{const target=Number(location.hash.slice(1));if(target&&target!==n+1)show(target-1)});
    show(n);
  </script>
</body>
</html>
